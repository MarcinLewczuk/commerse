<header class="bg-white/80 backdrop-blur-sm shadow-sm sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <div class="flex items-center gap-6">
        <a routerLink="/" class="flex items-center gap-3 cursor-pointer">
          <img src="/favicon-32x32.png" alt="Commerse logo" class="h-8 w-8 object-contain" />
          <span class="text-xl font-semibold text-gray-900">Commerse</span>
        </a>
        <a routerLink="/products" class="text-sm font-medium text-gray-600 hover:text-gray-900">Products</a>
      </div>
      <nav class="flex items-center gap-3">
        @if (auth.isAuthenticated$ | async) {
          @if (isSeller$ | async) {
            <a routerLink="/seller/dashboard" class="font-semibold inline-flex items-center px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white text-sm rounded-md transition-colors">
              My Shop
            </a>
          }
          <a routerLink="/dashboard" class="font-semibold inline-flex items-center px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm rounded-md transition-colors">
            Profile
          </a>
          <button (click)="logout()" class="text-sm font-semibold text-gray-700 hover:text-gray-900 cursor-pointer transition-colors">Log out</button>
        } @else {
          <button (click)="login()" class="font-semibold inline-flex items-center px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm rounded-md cursor-pointer transition-colors">Log in</button>
        }
      </nav>
    </div>
  </div>
</header>

<header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50 transition-colors">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-20">
      <!-- Logo and Main Nav -->
      <div class="flex items-center gap-12">
        <a routerLink="/" class="flex items-center gap-3 cursor-pointer group">
          <img src="/logo.png" alt="Commerse" class="h-10 transform group-hover:scale-105 transition-transform duration-200" />
          <span class="text-xl font-bold text-white">Commerse</span>
        </a>
        
        <nav class="hidden md:flex items-center gap-8">
          <a routerLink="/shops" class="text-sm font-medium text-gray-300 hover:text-white transition-colors">Shops</a>
          <a routerLink="/products" class="text-sm font-medium text-gray-300 hover:text-white transition-colors">Products</a>
          <a routerLink="/services" class="text-sm font-medium text-gray-300 hover:text-white transition-colors">Services</a>
        </nav>
      </div>

      <!-- Right Side Nav -->
      <nav class="flex items-center gap-4">
        <!-- Basket Icon -->
        <a routerLink="/basket" class="relative p-2.5 text-gray-300 hover:text-white hover:bg-gray-700 rounded-lg transition-all" title="Shopping Basket">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
          </svg>
          @if (basketItemCount() > 0) {
            <span class="absolute -top-1 -right-1 bg-indigo-600 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center shadow-lg">
              {{ basketItemCount() }}
            </span>
          }
        </a>

        @if (auth.isAuthenticated$ | async) {
          @if (isSeller$ | async) {
            <a routerLink="/seller/dashboard" class="hidden sm:inline-flex items-center gap-2 px-4 py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white text-sm font-semibold rounded-lg transition-all shadow-sm hover:shadow">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
              </svg>
              My Shop
            </a>
          }
          <a routerLink="/dashboard" class="hidden sm:inline-flex items-center gap-2 px-4 py-2.5 bg-gray-800 hover:bg-gray-700 text-white text-sm font-semibold rounded-lg transition-all">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
            Profile
          </a>
          <button (click)="logout()" class="text-sm font-medium text-gray-300 hover:text-white cursor-pointer transition-colors">
            Log out
          </button>
        } @else {
          <button (click)="login()" class="inline-flex items-center gap-2 px-5 py-2.5 bg-gray-800 hover:bg-gray-700 text-white text-sm font-semibold rounded-lg cursor-pointer transition-all shadow-sm hover:shadow">
            Log in
          </button>
        }
      </nav>
    </div>
  </div>
</header>

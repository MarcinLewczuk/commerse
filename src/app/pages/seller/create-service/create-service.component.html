<div class="container mx-auto px-4 py-8 max-w-3xl">
  <h1 class="text-4xl font-bold mb-8 text-gray-200">Add New Service</h1>

  <!-- Success Message -->
  @if (successMessage()) {
  <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-6" role="alert">
    <span class="block sm:inline">{{ successMessage() }}</span>
  </div>
  }

  <!-- Error Message -->
  @if (error()) {
  <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6" role="alert">
    <strong class="font-bold">Error:</strong>
    <span class="block sm:inline">{{ error() }}</span>
  </div>
  }

  <form (ngSubmit)="onSubmit()" class="bg-white shadow-md rounded-lg p-6 space-y-6">
    <!-- Service Name -->
    <div>
      <label for="name" class="block text-gray-700 font-semibold mb-2">Service Name *</label>
      <input type="text" id="name" name="name" [(ngModel)]="service.name" required
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="e.g., Hair Cut, Consultation, etc.">
    </div>

    <!-- Service Description -->
    <div>
      <label for="description" class="block text-gray-700 font-semibold mb-2">Description *</label>
      <textarea id="description" name="description" [(ngModel)]="service.description" required rows="4"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Describe your service in detail..."></textarea>
    </div>

    <!-- Price and Duration -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Price -->
      <div>
        <label for="price" class="block text-gray-700 font-semibold mb-2">Price ($) *</label>
        <input type="number" id="price" name="price" [(ngModel)]="service.price" required min="0" step="0.01"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="0.00">
      </div>

      <!-- Duration -->
      <div>
        <label for="duration" class="block text-gray-700 font-semibold mb-2">Duration (minutes) *</label>
        <input type="number" id="duration" name="duration" [(ngModel)]="service.duration_minutes" required min="1"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="30">
      </div>
    </div>

    <!-- Image Upload Section -->
    <div>
      <label class="block text-gray-700 font-semibold mb-2">Service Images (Max {{ maxImages }})</label>

      <!-- Drag and Drop Area -->
      <div (dragover)="onDragOver($event)" (drop)="onDrop($event)"
        class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-blue-500 transition-colors">
        <svg class="mx-auto h-12 w-12 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
        </svg>
        <p class="text-gray-600 mb-2">Drag and drop images here, or</p>
        <label for="imageUpload" class="cursor-pointer text-blue-600 hover:text-blue-700 font-semibold">
          Browse Files
        </label>
        <input type="file" id="imageUpload" (change)="onFileSelected($event)" accept="image/*" multiple class="hidden">
        <p class="text-gray-500 text-sm mt-2">
          {{ imageFiles().length }} / {{ maxImages }} images uploaded
        </p>
      </div>

      <!-- Image Previews -->
      @if (imagePreviews().length > 0) {
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mt-4">
        @for (preview of imagePreviews(); track $index) {
        <div class="relative group">
          <img [src]="preview" alt="Preview" class="w-full h-32 object-cover rounded-lg">
          <button type="button" (click)="removeImage($index)" class="absolute top-2 right-2 bg-red-500 text-white rounded-full p-1 
                       opacity-0 group-hover:opacity-100 transition-opacity hover:bg-red-600">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
        }
      </div>
      }
    </div>

    <!-- Submit Button -->
    <div class="flex justify-end space-x-4">
      <button type="button" routerLink="/seller/dashboard"
        class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-100 transition-colors">
        Cancel
      </button>
      <button type="submit" [disabled]="loading()" class="px-6 py-2 bg-blue-600 text-white rounded-lg font-semibold 
               hover:bg-blue-700 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed">
        @if (loading()) {
        <span>Creating...</span>
        } @else {
        <span>Create Service</span>
        }
      </button>
    </div>
  </form>
</div>

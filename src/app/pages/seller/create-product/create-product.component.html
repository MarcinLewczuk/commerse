<main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <!-- Back Button -->
  <button 
    (click)="goBack()"
    class="mb-6 text-sm text-purple-600 hover:text-purple-700 font-medium inline-flex items-center gap-1 cursor-pointer">
    ← Back to Dashboard
  </button>

  <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-8">
    <h1 class="text-3xl font-bold text-gray-900 mb-2">Create New Product</h1>
    <p class="text-gray-600 mb-8">Add a new product to your shop with images and details</p>

    <form (ngSubmit)="submitAddProduct()" novalidate class="space-y-6">
      <!-- Product Name -->
      <div>
        <div class="flex justify-between items-baseline mb-2">
          <label class="block text-sm font-medium text-gray-700">
            Product Name <span class="text-red-600">*</span>
          </label>
          <span class="text-xs text-gray-500">
            {{ productName().length }}/60
          </span>
        </div>
        <input
          type="text"
          [value]="productName()"
          (input)="handleNameInput($event)"
          name="name"
          maxlength="60"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent"
          placeholder="Enter product name"
          required
        />
      </div>

      <!-- Description -->
      <div>
        <div class="flex justify-between items-baseline mb-2">
          <label class="block text-sm font-medium text-gray-700">
            Description
          </label>
          <span class="text-xs text-gray-500">
            {{ productDescription().length }}/500
          </span>
        </div>
        <textarea
          [value]="productDescription()"
          (input)="handleDescriptionInput($event)"
          name="description"
          rows="4"
          maxlength="500"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent resize-none"
          placeholder="Enter product description"
        ></textarea>
      </div>

      <!-- Price -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Price <span class="text-red-600">*</span>
        </label>
        <div class="relative">
          <span class="absolute left-4 top-2 text-gray-700 font-medium">$</span>
          <input
            type="number"
            [(ngModel)]="productPrice"
            (ngModelChange)="productPrice.set($event)"
            name="price"
            step="0.01"
            min="0"
            class="w-full pl-8 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent"
            placeholder="0.00"
            required
          />
        </div>
      </div>

      <!-- Stock Quantity -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Stock Quantity
        </label>
        <input
          type="number"
          [value]="productStock()"
          (input)="handleStockInput($event)"
          name="stock_quantity"
          min="0"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent"
          placeholder="0"
        />
      </div>

      <!-- Image Upload -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Product Images (Max 10)
        </label>
        <input
          type="file"
          #fileInput
          (change)="onImagesSelected($event)"
          accept="image/*"
          multiple
          class="block w-full text-sm text-gray-500
            file:mr-4 file:py-2 file:px-4
            file:rounded-lg file:border-0
            file:text-sm file:font-semibold
            file:bg-purple-50 file:text-purple-700
            hover:file:bg-purple-100 cursor-pointer"
        />
        <p class="text-xs text-gray-500 mt-1">
          {{ selectedImages().length }}/10 images selected
        </p>

        <!-- Image Previews -->
        @if (selectedImages().length > 0) {
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2 mt-3">
            @for (image of selectedImages(); let i = $index; track i) {
              <div class="relative group">
                <img 
                  [src]="image.preview" 
                  [alt]="'Preview ' + (i + 1)"
                  class="w-full h-24 object-cover rounded-lg border border-gray-200"
                />
                <button
                  type="button"
                  (click)="removeImage(i)"
                  class="absolute top-1 right-1 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                  ×
                </button>
              </div>
            }
          </div>
        }
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-3 pt-6 border-t border-gray-200">
        <button
          type="submit"
          [disabled]="creatingProduct() || !productName().trim() || productPrice() < 0"
          class="flex-1 px-6 py-3 bg-purple-600 hover:bg-purple-700 disabled:bg-gray-400 text-white font-semibold rounded-lg transition cursor-pointer">
          {{ creatingProduct() ? 'Creating...' : 'Create Product' }}
        </button>
        <button
          type="button"
          (click)="goBack()"
          [disabled]="creatingProduct()"
          class="flex-1 px-6 py-3 bg-gray-200 hover:bg-gray-300 disabled:bg-gray-100 text-gray-900 font-semibold rounded-lg transition cursor-pointer">
          Cancel
        </button>
      </div>
    </form>
  </div>
</main>

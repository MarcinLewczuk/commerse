<div class="page-wrapper min-h-screen flex items-center justify-center bg-gray-50 p-6">
	<main class="auth-card bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
		<h1 class="text-2xl font-semibold text-gray-900 mb-4">Create account</h1>

		<form class="space-y-4">
			<label for="email" class="block">
				<span class="label-text block text-sm text-gray-500 mb-2">Email</span>
				<input type="email" name="email" required placeholder="you@example.com" [formControl]="emailControl" class="w-full px-4 py-2 border border-gray-200 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
			</label>

			<label for="password" class="block">
				<span class="label-text block text-sm text-gray-500 mb-2">Password</span>
				<input type="password" name="password" required placeholder="Choose a password" [formControl]="passwordControl" class="w-full px-4 py-2 border border-gray-200 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
			</label>

			<button type="submit" class="btn-primary w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-md cursor-pointer">Create account</button>
		</form>

		<p class="text-sm text-gray-600 mt-3">Submitted: <span class="font-mono text-sm text-gray-700">{{ emailControl.value }}</span></p>
		<p class="text-sm text-gray-600">Submitted: <span class="font-mono text-sm text-gray-700">{{ passwordControl.value }}</span></p>

		<p class="muted text-center text-sm text-gray-600 mt-4">Already have an account? <a routerLink="/login" class="text-indigo-600 font-medium cursor-pointer">Sign in</a></p>
	</main>
</div>
